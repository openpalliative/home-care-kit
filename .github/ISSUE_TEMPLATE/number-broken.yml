name: Номер не работает
description: Номер, который подсказывает сайт, не отвечает, отвечает другая организация или подпись неточная
title: "Номер: "
labels: ["report:number", "review:data"]
body:
  - type: markdown
    attributes:
      value: |
        ## Это сообщение увидят все

        **Не пишите ФИО, диагнозы, адреса, свои телефоны и телефоны близких. Не прикладывайте заполненный лист и его фото**

        Сообщайте о номерах, которые показывает сайт: подсказка по региону, 103, 112, горячая линия. Номера, которые вы вписали в лист сами, мы не видим, их проверяете вы

        Номера регионов берутся из таблицы Росздравнадзора через справочник «Куда звонить» (pal-directory). Мы сами никуда не звоним: передадим сообщение туда, и номер проверит человек
  - type: input
    id: region
    attributes:
      label: Регион
      placeholder: Пермский край
    validations:
      required: true
  - type: input
    id: number
    attributes:
      label: Номер, как он написан на сайте
      description: С кодом города, как на странице
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: Что не так
      options:
        - не отвечает
        - отвечает другая организация
        - другие часы работы
        - неверная подпись
        - другое
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: Когда звонили
      description: Дата и примерное время, например 12.10.2026, вечер
  - type: textarea
    id: right
    attributes:
      label: Где вы видели правильный номер
      description: Сайт или документ организации. Не пишите ФИО и адреса
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверьте перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, личных телефонов и номеров документов
          required: true
