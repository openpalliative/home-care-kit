  - id: common
    title: Что получить на руки
    branch: all
    blocks:
      - id: common-list
        kind: checklist
        print: true
        verified: false
        verified_at:
        review: {needs: both, reviewed_by: , reviewed_at: }
        items:
          - id: extract
            text: Выписку на руки, с назначениями и рекомендациями по уходу дома
            detail: Пока человек лежит в стационаре, выписку и копии медицинских документов выдают в течение суток после обращения
            branch: all
            norm_ids: [789n]
            quote_refs:
              - quote_id: 789n-p8
            verified: true
            verified_at: 2026-10-12
            source_ref: raw/789n/p005-p8.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: who-next
            text: Узнайте, кто будет наблюдать дома, и запишите его телефон
            branch: all
            verified: true
            verified_at: 2026-10-11
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: first-visit
            text: Спросите, когда первый визит или звонок врача домой
            branch: all
            verified: true
            verified_at: 2026-10-11
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: pain-days
            text: Обезболивание на первые дни дома. Спросите, выпишут ли рецепт. Или препарат могут выдать с собой вместе с выпиской, на срок приёма до 5 дней. Это решает руководитель больницы. Рецепт на препарат бесплатно или со скидкой больница при выписке не оформляет. Если отказали, попросите отказ на бумаге
            detail: Без рецепта в первые дни дома обезболивание получить труднее всего, особенно если выписывают перед выходными
            branch: all
            norm_ids: [1094n]
            quote_refs:
              - quote_id: 1094n-p3
            verified: true
            verified_at: 2026-10-12
            source_ref: raw/1094n/p007-pril1-p3.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: before-sign
            text: Прежде чем подписать бумагу, спросите, что она значит и что будет дальше
            branch: all
            verified: true
            verified_at: 2026-10-11
            review: {needs: legal, reviewed_by: , reviewed_at: }
  - id: has-vk
    title: Если есть заключение врачебной комиссии о паллиативной помощи
    branch: has-vk
    blocks:
      - id: vk-list
        kind: checklist
        print: true
        verified: false
        verified_at:
        review: {needs: both, reviewed_by: , reviewed_at: }
        items:
          - id: vk-copy
            text: Попросите копию заключения на руки, если её ещё нет
            branch: has-vk
            norm_ids: [208n-243n]
            quote_refs:
              - quote_id: 208n-243n-p17
            verified: true
            verified_at: 2026-10-11
            source_ref: raw/208n-243n/p006-p12-p17.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: handover
            text: Если выписывают из паллиативного отделения или хосписа, спросите, отправили ли копию выписки в поликлинику и выездную службу, и когда придут на первый осмотр домой
            detail: В положении о паллиативной помощи записано, что первичный осмотр организуют в течение 2 рабочих дней после такой выписки
            branch: has-vk
            norm_ids: [208n-243n]
            quote_refs:
              - quote_id: 208n-243n-p20
            verified: true
            verified_at: 2026-10-11
            source_ref: raw/208n-243n/p007-p18-p20.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: mse-social
            text: Спросите, оформили ли направление на медико-социальную экспертизу и обращение о социальном обслуживании
            branch: has-vk
            norm_ids: [208n-243n]
            quote_refs:
              - quote_id: 208n-243n-p18
            verified: true
            verified_at: 2026-10-11
            source_ref: raw/208n-243n/p007-p18-p20.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
          - id: devices
            text: Медицинские изделия для дома. Попросите оформить их передачу до выписки
            detail: Решение о передаче принимает врачебная комиссия в течение 3 рабочих дней после того, как получит документы. Передают изделие в течение 5 рабочих дней после решения, по договору
            branch: has-vk
            norm_ids: [505n, 398n]
            quote_refs:
              - quote_id: 505n-p4
              - quote_id: 505n-p5
            links:
              - label: Кто выдаёт изделия
                repo: pal-devices-data
                path: ""
            verified: true
            verified_at: 2026-10-12
            source_ref: raw/505n/p003-p4-p5.txt
            review: {needs: legal, reviewed_by: , reviewed_at: }
