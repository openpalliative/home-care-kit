      - id: vk-decides
        kind: quote
        title: Кто решает
        text: Взрослому заключение выдают по решению врачебной комиссии или консилиума врачей той организации, где он наблюдается и лечится. При злокачественном новообразовании решает врач-онколог, если диагноз подтверждён гистологически. Или участковый терапевт, врач общей практики, фельдшер, другой врач-специалист, если есть заключение онколога о том, что нужно симптоматическое лечение. Ребёнку заключение выдаёт врачебная комиссия организации, где он наблюдается и лечится
        norm_ids: [208n-243n]
        quote_refs:
          - quote_id: 208n-243n-p12
          - quote_id: 208n-243n-p13
          - quote_id: 208n-243n-p15
        print: true
        verified: true
        verified_at: 2026-10-12
        source_ref: raw/208n-243n/p006-p12-p17.txt
        review: {needs: legal, reviewed_by: , reviewed_at: }
  - id: group
    title: Показания по заболеванию
    blocks:
      - id: ind-group
        kind: indications
        text: Выберите группу заболеваний. Если нужной группы нет, спросите врача, какие показания к вам относятся
        groups: [dementia, stroke, als, chf]
        norm_ids: [208n-243n]
        print: true
        verified: false
        verified_at:
        review: {needs: both, reviewed_by: , reviewed_at: }
