            who: Больница. Правила ухода и доступа она устанавливает сама и размещает на своём сайте
            when: Человек с инвалидностью I группы в круглосуточном стационаре имеет право на уход близкого, круглосуточный доступ для ухода бесплатный. Условия совместного пребывания с ребёнком до 4 лет, а со старшим при медицинских показаниях, включает территориальная программа региона
